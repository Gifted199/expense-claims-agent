repos:
  # File checks from pre-commit-hooks (pinned dev dependency in pyproject.toml).
  # They run via `python -m` because Windows Application Control blocks pip's .exe launchers.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run python -m pre_commit_hooks.check_added_large_files
        language: system
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private key
        entry: uv run python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Local secret scan. gitleaks runs in CI instead (see .github/workflows/ci.yml),
  # because Windows Application Control blocks its unsigned binary on the dev PC.
  # detect-secrets runs via `python -m` (pinned dev dependency) for the same reason: Application
  # Control intermittently blocks the hook's .exe launcher (D30).
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: uv run python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^uv\.lock$
