# Streamlit theme for the Expense Claims Assistant (consistent across pages).
[theme]
base = "light"
primaryColor = "#1F5FAD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5FA"
textColor = "#1E2430"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false
